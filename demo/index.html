<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit — рабочие задачи</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182b36;background:#f4f6f5}*{box-sizing:border-box}body{margin:0}header{background:#112e32;color:#fff;padding:24px 6%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:800;letter-spacing:3px}.tag{font-size:12px;letter-spacing:2px;color:#9fc6bb}main{max-width:1000px;margin:64px auto;padding:0 24px}.eyebrow{color:#588075;letter-spacing:2px;font-size:12px;font-weight:700}h1{font-size:46px;letter-spacing:-2px;margin:12px 0}p{color:#667975;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0}.stat,section{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:24px}.stat strong{display:block;font-size:32px;margin:8px 0}.stat span{color:#667975;font-size:13px}form{display:flex;gap:12px;align-items:end}label{flex:1;font-size:13px;font-weight:600}input:not([type=checkbox]){width:100%;margin-top:8px;border:1px solid #c7d6ce;border-radius:8px;padding:14px;font:inherit;font-size:16px}button{border:0;border-radius:8px;background:#146854;color:white;padding:14px 20px;font:inherit;cursor:pointer}button:hover{background:#0b4a3a}button:focus-visible,input:focus-visible{outline:3px solid #dfa953;outline-offset:3px}ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid #e4ebe7}li label{font-size:16px;font-weight:400}li input{margin-right:12px;accent-color:#146854;width:18px;height:18px}li button{background:#f6eeeb;color:#944431;padding:8px 12px;font-size:13px}li:has(input:checked) label{text-decoration:line-through;color:#74867e}#empty{text-align:center;padding:40px 0;color:#82938b}#status{font-size:13px;margin-top:24px}footer{margin-top:28px;font-size:12px;color:#75877d}@media(max-width:600px){main{margin-top:32px}h1{font-size:34px}.stats{gap:8px}.stat{padding:14px}form{display:block}form button{margin-top:12px;width:100%}.tag{display:none}}
</style></head><body>
<header><div class="brand">ORBIT<span style="color:#86c8a5">.</span></div><span class="tag">WORKSPACE / LOCAL DEMO</span></header>
<main><div class="eyebrow">ПРОСТРАНСТВО ДЛЯ ВАЖНОГО</div><h1>Рабочие задачи</h1><p>Освободите голову. Соберите планы и отмечайте сделанное.</p>
<div class="stats"><div class="stat"><span>Всего задач</span><strong id="total">0</strong></div><div class="stat"><span>В работе</span><strong id="active">0</strong></div><div class="stat"><span>Завершено</span><strong id="done">0</strong></div></div>
<section aria-label="Список задач"><form id="create"><label>Новая задача<input id="title" required maxlength="240" placeholder="Что нужно сделать?" autocomplete="off"></label><button>Добавить</button></form><ul id="tasks"></ul><div id="empty">Пока чистый лист. Добавьте первую задачу.</div><p role="status" id="status">Готово</p></section>
<footer>Локальное демо · задачи сохраняются в этом браузере</footer></main>
<script>
const list=document.querySelector('#tasks'); let tasks=[];
try{tasks=JSON.parse(localStorage.getItem('orbit.tasks')||'[]');if(!Array.isArray(tasks))tasks=[];}catch{}
function render(){list.replaceChildren();for(const task of tasks){const li=document.createElement('li'),label=document.createElement('label'),check=document.createElement('input'),del=document.createElement('button');check.type='checkbox';check.checked=task.done;check.onchange=()=>{task.done=check.checked;document.querySelector('#status').textContent=task.done?'Завершена: '+task.title:'Возобновлена: '+task.title;render()};label.append(check,document.createTextNode(task.title));del.textContent='Удалить';del.setAttribute('aria-label','Удалить '+task.title);del.onclick=()=>{tasks=tasks.filter(t=>t!==task);document.querySelector('#status').textContent='Удалена: '+task.title;render()};li.append(label,del);list.append(li)}document.querySelector('#total').textContent=tasks.length;document.querySelector('#done').textContent=tasks.filter(t=>t.done).length;document.querySelector('#active').textContent=tasks.filter(t=>!t.done).length;document.querySelector('#empty').hidden=tasks.length>0;try{localStorage.setItem('orbit.tasks',JSON.stringify(tasks))}catch{}}
document.querySelector('#create').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#title');if(!title.value.trim())return;tasks.push({title:title.value.trim(),done:false});document.querySelector('#status').textContent='Добавлена: '+title.value.trim();title.value='';render()};render();
</script></body></html>
